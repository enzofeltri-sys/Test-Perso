name: DIAGNOSTIC temporaire - profondeur historique exchanges

on:
  workflow_dispatch: {}

jobs:
  diag:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: trading_bot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ccxt
      - run: python _diag_exchange_history.py
